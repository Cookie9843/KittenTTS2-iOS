name: Release (unsigned full-app IPA on v* tags)

# Runs only when a version tag such as v1.0.0 is pushed (or manually, as a build-only dry run that publishes nothing).
# It builds the REAL audio.cpp kitten_tts2 runtime, links it into the full app, refuses to continue unless the native symbols
# are in the binary, and attaches that unsigned IPA to the GitHub Release for the tag. The UI-only compile check
# (build_unsigned_ipa.yml) is never published. The IPA is UNSIGNED: each user signs it with their own Apple ID or certificate.
# Maintainers: see "Publishing a release" in README.md. Nothing here creates or pushes a tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must point at a commit on main
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main; refusing to release" >&2; exit 1; }
      - name: swift test
        run: swift test
      - name: Bridge lifecycle test (fake audio.cpp ABI; no model)
        run: scripts/run_bridge_lifecycle_test.sh
      - name: Shell syntax checks
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Set work directories
        run: |
          {
            echo "WORK=$RUNNER_TEMP/audiocpp-work"
            echo "LOG_DIR=$RUNNER_TEMP/audiocpp-logs"
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            echo "CCACHE_MAXSIZE=2G"
          } >> "$GITHUB_ENV"
      - name: Install ninja and ccache
        run: brew install ninja ccache
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-ios-audiocpp-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-ios-audiocpp-${{ runner.os }}-
      - name: Build audio.cpp kitten_tts2 runtime for iOS arm64
        timeout-minutes: 150
        run: |
          set -o pipefail
          mkdir -p "$LOG_DIR"
          ./scripts/build_audiocpp_ios.sh 2>&1 | tee "$LOG_DIR/build_audiocpp_ios.log"
          grep -q '^RESULT: audio.cpp kitten_tts2 CPU runtime + C ABI built for iOS arm64' "$LOG_DIR/build_audiocpp_ios.log"
      - name: Build unsigned full app IPA linked against the runtime
        run: |
          set -o pipefail
          OUT="$RUNNER_TEMP/app-ipa" ./scripts/build_app_ipa.sh 2>&1 | tee "$LOG_DIR/build_app_ipa.log"
          grep -q '^RESULT: unsigned full-app IPA linked against audio.cpp kitten_tts2 runtime' "$LOG_DIR/build_app_ipa.log"
      - name: Gate - the packaged binary contains the real runtime and no model weights
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/app-ipa/KittenTTS-unsigned.ipa"
          CHECK="$RUNNER_TEMP/ipa-check"
          rm -rf "$CHECK"; mkdir -p "$CHECK"
          unzip -q "$IPA" -d "$CHECK"
          BIN="$CHECK/Payload/KittenTTS2App.app/KittenTTS2App"
          test -f "$BIN"
          nm "$BIN" > "$CHECK/syms.txt"
          for sym in _audiocpp_model_load _audiocpp_session_run; do
            grep -q " T $sym\$" "$CHECK/syms.txt" || { echo "$sym missing: refusing to publish a UI-only build" >&2; exit 1; }
          done
          for sym in _kt_load _kt_synthesize _kt_synthesize_clone; do
            grep -Eq " [Tt] $sym\$" "$CHECK/syms.txt" || { echo "$sym missing: refusing to publish" >&2; exit 1; }
          done
          if unzip -l "$IPA" | grep -qi '\.gguf'; then echo "model weights found in IPA" >&2; exit 1; fi
      - name: Name the asset and write its checksum
        run: |
          set -euo pipefail
          NAME="KittenTTS-${GITHUB_REF_NAME//\//-}-unsigned.ipa"
          mkdir -p "$RUNNER_TEMP/release"
          cp "$RUNNER_TEMP/app-ipa/KittenTTS-unsigned.ipa" "$RUNNER_TEMP/release/$NAME"
          (cd "$RUNNER_TEMP/release" && shasum -a 256 "$NAME" > "$NAME.sha256")
          cat "$RUNNER_TEMP/release/$NAME.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  publish:
    # Only for real tag pushes; a manual run stops after "build" and publishes nothing.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-ipa
          path: release
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTES=$'Unsigned full-app IPA for iPhone and iPad (iOS 16.4+), built from this tag with the real audio.cpp KittenTTS 2 runtime linked in.\n\n**The IPA is unsigned.** Sign it with your own Apple ID or certificate using a signing or sideloading tool you trust before installing. No model weights are included: download or import KittenTTS 2 in the app (Models tab). Verify the download with the attached `.sha256` file.\n\nCI proves that the app builds and links; it does not prove inference on any particular device. See the README for tested hardware and troubleshooting.'
          PRE=()
          case "$TAG" in *-*) PRE=(--prerelease) ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "KittenTTS2-iOS $TAG" --notes "$NOTES" "${PRE[@]}"
          fi
