name: iOS audio.cpp runtime + full app IPA

# Builds the REAL audio.cpp kitten_tts2 CPU runtime for iOS arm64 and links it into the unsigned full KittenTTS app (iPhone + iPad).
# CI proves compilation/linking only. Model load and audio generation can only be proven on a device with the
# compatible kitten-tts2-native-q8-multilingual.gguf; the model is never downloaded or committed.
# Any failing step fails the job (no continue-on-error).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - NativeAudioCpp/**
      - KittenTTS2App/**
      - Sources/**
      - Tests/**
      - Package.swift
      - scripts/build_app_ipa.sh
      - Sources/KittenCore/AudioCppGGUF.swift
      - Sources/KittenCore/AudioCppDiagnostics.swift
      - scripts/patches/**
      - Sources/KittenCore/WAVEncoder.swift
      - scripts/build_audiocpp_ios.sh
      - scripts/cmake/**
      - THIRD_PARTY_NOTICES.md
      - .github/workflows/ios_audiocpp_kitten2.yml
  push:
    branches:
      - main
    paths:
      - NativeAudioCpp/**
      - KittenTTS2App/**
      - Sources/**
      - Package.swift
      - scripts/build_app_ipa.sh
      - scripts/build_audiocpp_ios.sh
      - scripts/cmake/**
      - scripts/patches/**
      - .github/workflows/ios_audiocpp_kitten2.yml

permissions:
  contents: read

jobs:
  swift-tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: swift test (audio.cpp GGUF metadata parsing, validation, resource checks)
        run: swift test
      - name: Bridge lifecycle test (fake audio.cpp ABI; no model)
        run: scripts/run_bridge_lifecycle_test.sh

  audiocpp-ios-ipa:
    needs: swift-tests
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Set work directories
        run: |
          {
            echo "WORK=$RUNNER_TEMP/audiocpp-work"
            echo "LOG_DIR=$RUNNER_TEMP/audiocpp-logs"
            echo "OUT=$RUNNER_TEMP/audiocpp-ipa"
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            echo "CCACHE_MAXSIZE=2G"
          } >> "$GITHUB_ENV"
      - name: Install ninja and ccache
        run: brew install ninja ccache
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-ios-audiocpp-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-ios-audiocpp-${{ runner.os }}-
      - name: Build audio.cpp kitten_tts2 runtime for iOS arm64
        timeout-minutes: 150
        run: |
          set -o pipefail
          mkdir -p "$LOG_DIR"
          ./scripts/build_audiocpp_ios.sh 2>&1 | tee "$LOG_DIR/build_audiocpp_ios.log"
      - name: Require native build verification line
        run: |
          grep -q '^RESULT: audio.cpp kitten_tts2 CPU runtime + C ABI built for iOS arm64' "$LOG_DIR/build_audiocpp_ios.log"
      - name: Build unsigned full app IPA (iPhone + iPad) linked against the same runtime
        run: |
          set -o pipefail
          OUT="$RUNNER_TEMP/app-ipa" ./scripts/build_app_ipa.sh 2>&1 | tee "$LOG_DIR/build_app_ipa.log"
      - name: Require full-app link verification line
        run: |
          grep -q '^RESULT: unsigned full-app IPA linked against audio.cpp kitten_tts2 runtime' "$LOG_DIR/build_app_ipa.log"
      - name: Inspect full app IPA contents (no model weights)
        run: |
          set -o pipefail
          unzip -l "$RUNNER_TEMP/app-ipa/KittenTTS-unsigned.ipa" | tee "$LOG_DIR/app-ipa-contents.txt"
          if grep -qi '\.gguf' "$LOG_DIR/app-ipa-contents.txt"; then echo "model weights found in IPA" >&2; exit 1; fi
      - name: Upload unsigned full app IPA
        uses: actions/upload-artifact@v4
        with:
          name: KittenTTS-unsigned-ipa
          path: ${{ runner.temp }}/app-ipa/KittenTTS-unsigned.ipa
          if-no-files-found: error
      - name: Summary
        if: always()
        run: |
          {
            echo "### audio.cpp KittenTTS 2 iOS full-app IPA"
            echo "| Stage | Evidence |"
            echo "| --- | --- |"
            echo "| Metadata validation | swift test (fixtures), runs in the app on the selected GGUF |"
            echo "| Native build/link | $(grep -h '^RESULT:' "$LOG_DIR"/*.log 2>/dev/null | tr '\n' ' ')|"
            echo "| Model load on iOS | NOT proven by CI (needs a device + the 3.28 GB model) |"
            echo "| Audio generation / voice cloning | NOT proven by CI |"
            echo "| Signing | The IPA is UNSIGNED: it must be signed with your own Apple ID or certificate before it installs on a device |"
            echo '```'
            tail -n 30 "$LOG_DIR/build_audiocpp_ios.log" 2>/dev/null || true
            tail -n 15 "$LOG_DIR/build_app_ipa.log" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiocpp-ios-build-logs
          path: ${{ runner.temp }}/audiocpp-logs
          if-no-files-found: warn
