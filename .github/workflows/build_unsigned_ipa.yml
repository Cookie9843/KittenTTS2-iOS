name: Build UI-only app (device + simulator compile check)

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test

  build:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app
        run: |
          set -euo pipefail
          xcodebuild \
            -project "KittenTTS2App/KittenTTS2App.xcodeproj" \
            -scheme "KittenTTS2App" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build app for iOS Simulator (iPhone and iPad idioms)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "KittenTTS2App/KittenTTS2App.xcodeproj" \
            -scheme "KittenTTS2App" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataSim" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # The IPA that contains the KittenTTS 2 runtime is produced by "iOS audio.cpp KittenTTS 2 test IPA + full app IPA"
      # (artifact KittenTTS-unsigned-ipa). This job compiles the UI-only variant (runtime stub) as a fast check and
      # deliberately uploads no IPA so that a runtime-less build cannot be mistaken for the real app.
