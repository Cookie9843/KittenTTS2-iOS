name: iOS native probe (experimental)

# Feasibility spike only: does the custom TQ2_1 llama.cpp fork cross-compile for iOS arm64?
# Failure here is informative and does not block the main app build.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/probe_ios_native.sh
      - .github/workflows/ios_native_probe.yml

permissions:
  contents: read

jobs:
  llama-fork-ios-arm64:
    runs-on: macos-latest
    timeout-minutes: 180
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja and ccache
        run: brew install ninja ccache
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-ios-llama-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-ios-llama-${{ runner.os }}-
      - name: Build custom llama.cpp fork for iOS arm64
        timeout-minutes: 165
        env:
          WORK: ${{ runner.temp }}/probe
          LOG_DIR: ${{ runner.temp }}/probe-logs
          CCACHE_MAXSIZE: 1G
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          set -o pipefail
          mkdir -p "$LOG_DIR"
          ./scripts/probe_ios_native.sh 2>&1 | tee "$LOG_DIR/probe.log"
      - name: Summary
        if: always()
        run: |
          {
            echo "### iOS native probe"
            echo '```'
            tail -n 40 "$RUNNER_TEMP/probe-logs/probe.log" || true
            echo '```'
            echo "Probe only: verifies custom llama.cpp static libs. Does not solve the LibTorch decoder/normalizer blocker and produces no KittenTTS audio."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-probe-logs
          path: ${{ runner.temp }}/probe-logs
          if-no-files-found: warn
